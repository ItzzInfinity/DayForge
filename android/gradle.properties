# Trimmed from the Flutter template's -Xmx8G/-XX:MaxMetaspaceSize=4G: on a
# 16 GB workstation with no swap, Gradle plus the four parallel Dart AOT
# compilers overshot RAM and the kernel killed the build ("Killed", 2026-08-18).
# 3 GB is comfortable for this app; raise it again on a bigger machine.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
